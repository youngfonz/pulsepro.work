# Slack app for the Pulse Pro request tracker.
# api.slack.com/apps > Create New App > From a manifest > BGC workspace > paste this.
display_information:
  name: Pulse Tracker
  description: Files Joel's requests and edits into the Joel requests List and drafts copy changes for approval.
  background_color: "#1a1a1a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Pulse Tracker
    always_online: true
oauth_config:
  scopes:
    user:
      - im:history
      - chat:write
      - lists:read
      - lists:write
    bot:
      - chat:write
      - im:write
settings:
  event_subscriptions:
    request_url: https://www.pulsepro.work/api/webhook/slack/events
    user_events:
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://www.pulsepro.work/api/webhook/slack/interact
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
